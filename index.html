<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fastask</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/osvaldo-ronquillo/Fastask/main/img/fastask.png?v=202606020748">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-straight/css/uicons-solid-straight.css">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, collection, addDoc, doc, updateDoc, deleteDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithPopup, getRedirectResult, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2WT0lxJ_qrkwF5V04PyFkuYFMEagENuU",
  authDomain: "fastcheck-38bf7.firebaseapp.com",
  projectId: "fastcheck-38bf7",
  storageBucket: "fastcheck-38bf7.firebasestorage.app",
  messagingSenderId: "568423642636",
  appId: "1:568423642636:web:401de51518b864dc11a029"
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { localCache: persistentLocalCache() });
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const tasksCol = collection(db, "voztasks");
const notesCol = collection(db, "fastask_notes");

if(localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');

/* ---- Auth ---- */
let appReady = false;
onAuthStateChanged(auth, async user => {
  if(appReady) return; 
  if(user && !user.isAnonymous) { appReady = true; showApp(); } 
  else {
    if(user?.isAnonymous) await auth.signOut();
    try {
      const result = await getRedirectResult(auth);
      if(result?.user && !result.user.isAnonymous) { appReady = true; showApp(); return; }
    } catch(e) { console.error("Redirect error:", e); }
    showAuthScreen();
  }
});

function showApp(){
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app-main").style.display = "grid";
  startListeners();
}
function showAuthScreen(){
  document.getElementById("auth-screen").style.display = "flex";
  document.getElementById("app-main").style.display = "none";
}
window.signInGoogle = async () => {
  const btn = document.getElementById("google-signin-btn");
  btn.textContent = "Iniciando..."; btn.disabled = true;
  try { await signInWithPopup(auth, provider); } 
  catch (error) { btn.textContent = "Entrar con Google"; btn.disabled = false; }
};

/* ---- State ---- */
let tasks = [], notes = [];
let isListening = false, recognition = null;
let activeCategory = null, activePriority = null, searchQuery = "";
let isArchiveView = false;
let currentMonth = new Date();
let dragSrcId = null;

const PRIORITIES = [
  { id:"baja",  label:"Baja", icon:"fi-rr-signal-alt", letter:"B" },
  { id:"media", label:"Media", icon:"fi-rr-signal-alt-1", letter:"M" },
  { id:"alta",  label:"Alta", icon:"fi-rr-signal-alt-2", letter:"A" }
];

function catColor(c){ return getComputedStyle(document.documentElement).getPropertyValue(`--cat-${c}`).trim() || "#a2a8a8"; }
function getPrio(id){ return PRIORITIES.find(p=>p.id===id) || PRIORITIES[0]; }

/* ---- Render ---- */
function renderAll(){ renderKanban(); renderCalendar(); renderNotes(); renderBadge(); updateSidebarActive(); }

function renderBadge(){
  const pending = tasks.filter(t => t.status !== "done" && t.status !== "archived");
  document.getElementById("pending-count").textContent = pending.length;
}

function updateSidebarActive(){
  document.querySelectorAll(".cat-item").forEach(el=>el.classList.toggle("active", el.dataset.id===activeCategory));
  document.querySelectorAll(".prio-item").forEach(el=>el.classList.toggle("active", el.dataset.id===activePriority));
  document.getElementById("btn-archive").classList.toggle("active", isArchiveView);
}

window.toggleArchiveView = () => {
  isArchiveView = !isArchiveView;
  activeCategory = null; activePriority = null;
  
  if(isArchiveView) {
    document.getElementById("kanban-columns").style.display = "none";
    document.getElementById("archive-container").style.display = "block";
  } else {
    document.getElementById("kanban-columns").style.display = "grid";
    document.getElementById("archive-container").style.display = "none";
  }
  renderAll();
};

function filteredTasks(){
  return tasks.filter(t=>{
    if(isArchiveView) return t.status === "archived";
    if(t.status === "archived") return false; 
    if(activeCategory && t.category!==activeCategory) return false;
    if(activePriority && t.priority!==activePriority) return false;
    if(searchQuery && !t.title?.toLowerCase().includes(searchQuery.toLowerCase())) return false;
    return true;
  });
}

function sortTasksByDeadline(tasksArray) {
  return tasksArray.sort((a, b) => {
    if (!a.deadline) return 1;
    if (!b.deadline) return -1;
    return new Date(a.deadline) - new Date(b.deadline);
  });
}

function taskCard(t){
  const prio = getPrio(t.priority);
  
  let countdownHtml = '';
  let dateHtml = `<div class="tc-date-box empty-date" onclick="openDeadlineModal('${t.id}')" title="Asignar fecha"><i class="fi fi-rr-calendar-plus"></i></div>`;
  
  if (t.deadline) {
    const d = new Date(t.deadline+"T12:00:00");
    const today = new Date(); today.setHours(0,0,0,0);
    const dlStart = new Date(t.deadline+"T00:00:00");
    const diff = Math.ceil((dlStart - today) / (1000 * 60 * 60 * 24));
    
    let cdText = diff > 0 ? `+${diff}` : (diff < 0 ? `${diff}` : `0`);
    countdownHtml = `<div class="tc-countdown">${cdText}</div>`;
    
    const day = d.getDate();
    const month = d.toLocaleDateString("es-MX",{month:"short"}).slice(0,3).toLowerCase();
    dateHtml = `<div class="tc-date-box" onclick="openDeadlineModal('${t.id}')" title="Cambiar fecha"><div class="tc-day">${day}</div><div class="tc-month">${month}</div></div>`;
  }

  const attachCount = (t.link ? 1 : 0) + (t.document ? 1 : 0);
  const bullets = (t.context || "").split("\n").filter(c=>c.trim()!=='');
  const ctxCount = bullets.length;

  return `
  <div class="task-card" data-id="${t.id}" style="--c: ${catColor(t.category)};" draggable="${!isArchiveView}">
    <div class="tc-left">
      ${dateHtml}
      ${countdownHtml}
    </div>
    
    <div class="tc-right">
      <div class="tc-title-wrap">
        <div class="tc-title" onclick="startEditTitle('${t.id}')" title="Clic para editar">${t.title}</div>
      </div>
      
      <div class="tc-bottom">
        <div class="tc-icons">
          
          <div class="tc-menu-wrap" title="Cambiar Prioridad">
            <div class="tc-icon-item" style="cursor: pointer;">
              <i class="fi ${prio.icon}"></i>
              <span>${prio.letter}</span>
            </div>
            <div class="tc-dropdown tc-dropdown-left">
              <button onclick="updateTaskField('${t.id}', 'priority', 'baja')"><i class="fi fi-rr-signal-alt"></i> Baja</button>
              <button onclick="updateTaskField('${t.id}', 'priority', 'media')"><i class="fi fi-rr-signal-alt-1"></i> Media</button>
              <button onclick="updateTaskField('${t.id}', 'priority', 'alta')"><i class="fi fi-rr-signal-alt-2"></i> Alta</button>
            </div>
          </div>

          <div class="tc-icon-item" onclick="openAttachmentsModal('${t.id}')" title="Adjuntos">
            <i class="fi fi-rr-paperclip-vertical"></i>
            <span>${attachCount}</span>
          </div>
          <div class="tc-icon-item" onclick="openContextModal('${t.id}')" title="Comentarios">
            <i class="fi fi-rr-comment-dots"></i>
            <span>${ctxCount}</span>
          </div>
        </div>
        
        <div class="tc-menu-wrap tc-menu-wrap-always">
          <i class="fi fi-rr-angle-small-down tc-menu-trigger"></i>
          <div class="tc-dropdown">
            <button onclick="duplicateTask('${t.id}')"><i class="fi fi-rr-clone"></i> Duplicar</button>
            ${t.status === 'archived' 
              ? `<button onclick="updateTaskField('${t.id}', 'status', 'todo')"><i class="fi fi-rr-rotate-right"></i> Restaurar</button>`
              : `<button onclick="updateTaskField('${t.id}', 'status', 'archived')"><i class="fi fi-rr-folder-download"></i> Archivar</button>`}
            <button onclick="deleteTask('${t.id}')" style="color:#F24061"><i class="fi fi-rr-trash"></i> Eliminar</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderKanban(){
  const ft = filteredTasks();
  
  if(isArchiveView) {
    const sortedArchive = sortTasksByDeadline(ft);
    document.getElementById("archive-masonry").innerHTML = sortedArchive.length ? sortedArchive.map(taskCard).join("") : `<div class="empty-col">Archivo vacío</div>`;
    document.querySelectorAll("#archive-masonry .task-card").forEach(el => el.removeAttribute("draggable"));
    return;
  }

  // Filtrado y Ordenado por Deadline
  const todo = sortTasksByDeadline(ft.filter(t=>!t.status||t.status==="todo"));
  const inprog = sortTasksByDeadline(ft.filter(t=>t.status==="inprogress"));
  const done = sortTasksByDeadline(ft.filter(t=>t.status==="done"));

  document.getElementById("col-todo").innerHTML = todo.length ? `<div class="masonry-wrap">${todo.map(taskCard).join("")}</div>` : `<div class="empty-col">Sin tareas</div>`;
  document.getElementById("col-inprogress").innerHTML = inprog.length ? `<div class="masonry-wrap">${inprog.map(taskCard).join("")}</div>` : `<div class="empty-col">Sin tareas</div>`;
  document.getElementById("col-done").innerHTML = done.length ? `<div class="masonry-wrap">${done.map(taskCard).join("")}</div>` : `<div class="empty-col">Sin tareas</div>`;

  document.getElementById("cnt-todo").textContent = todo.length;
  document.getElementById("cnt-inprog").textContent = inprog.length;
  document.getElementById("cnt-done").textContent = done.length;

  document.querySelectorAll(".task-card").forEach(attachDrag);
}

window.startEditTitle = (id) => {
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const cardEl = document.querySelector(`.task-card[data-id="${id}"] .tc-title`);
  const old = t.title;
  cardEl.contentEditable = "true";
  cardEl.focus();
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(cardEl);
  sel.removeAllRanges(); sel.addRange(range);
  cardEl.onblur = async () => {
    cardEl.contentEditable = "false";
    const newTitle = cardEl.textContent.trim();
    if(newTitle && newTitle !== old) await updateDoc(doc(db,"voztasks",id),{title:newTitle});
  };
  cardEl.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); cardEl.blur(); } };
};

window.highlightTask = (id) => {
  document.querySelectorAll('.task-card').forEach(el => el.classList.remove('active-highlight'));
  const el = document.querySelector(`.task-card[data-id="${id}"]`);
  if(el) {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("active-highlight");
  }
}

/* ---- Drag & Drop ---- */
function attachDrag(el){
  el.addEventListener("dragstart", e=>{ dragSrcId=el.dataset.id; window.dragSrcId=el.dataset.id; setTimeout(()=>el.classList.add("dragging"),0); });
  el.addEventListener("dragend", ()=>{ el.classList.remove("dragging"); dragSrcId=null; window.dragSrcId=null; });
}
document.querySelectorAll(".kanban-col").forEach(col=>{
  col.addEventListener("dragover", e=>{ e.preventDefault(); col.classList.add("drag-over"); });
  col.addEventListener("dragleave", ()=>col.classList.remove("drag-over"));
  col.addEventListener("drop", async e=>{
    e.preventDefault(); col.classList.remove("drag-over");
    const sId = dragSrcId || window.dragSrcId;
    if(!sId) return;
    await updateDoc(doc(db,"voztasks",sId),{status:col.dataset.status});
  });
});

/* ---- Firebase ---- */
function startListeners() {
  const q = query(tasksCol, orderBy("createdAt","asc"));
  onSnapshot(q, snap=>{ tasks=snap.docs.map(d=>({id:d.id,...d.data()})); renderAll(); });
  const qn = query(notesCol, orderBy("createdAt","desc"));
  onSnapshot(qn, snap=>{ notes=snap.docs.map(d=>({id:d.id,...d.data()})); renderNotes(); });
}

window.updateTaskField = async (id, field, value) => { await updateDoc(doc(db, "voztasks", id), { [field]: value }); };
window.deleteTask = async id=>{ if(confirm("¿Eliminar tarea definitivamente?")) await deleteDoc(doc(db,"voztasks",id)); };
window.duplicateTask = async id => {
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const { id:_, ...data } = t;
  data.createdAt = new Date().toISOString();
  await addDoc(tasksCol, data);
};

/* ---- Modals ---- */
function openModal(html){
  document.getElementById("modal-content").innerHTML = html;
  document.getElementById("modal-overlay").classList.add("open");
}

window.closeModal = () => { document.getElementById("modal-overlay").classList.remove("open"); };

document.addEventListener('keydown', e => { 
  if(e.key === 'Escape' && document.getElementById("modal-overlay").classList.contains("open")) { window.closeModal(); }
});

// Modal Deadline
window.openDeadlineModal = (id)=>{
  const t = tasks.find(x=>x.id===id);
  const val = t?.deadline||"";
  openModal(`
    <h3 class="modal-title">Establecer Fecha Límite</h3>
    <input type="date" id="modal-date" value="${val}" class="modal-input" style="font-size:15px;">
    <div class="modal-btns">
      <button class="modal-btn" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn primary" onclick="saveDeadline('${id}')">Guardar</button>
    </div>
  `);
};
window.saveDeadline = async (id) => {
  const date = document.getElementById("modal-date").value;
  await updateDoc(doc(db,"voztasks",id),{deadline:date||null});
  closeModal();
};

window.openAttachmentsModal = (id)=>{
  const t = tasks.find(x=>x.id===id);
  openModal(`
    <h3 class="modal-title">Archivos y Enlaces</h3>
    <label class="modal-label"><i class="fi fi-rr-link"></i> Enlace Web (URL)</label>
    <input type="url" id="modal-link" value="${t?.link||""}" placeholder="https://..." class="modal-input">
    
    <label class="modal-label"><i class="fi fi-rr-document"></i> Documento de Drive/Nube (URL)</label>
    <input type="url" id="modal-doc" value="${t?.document||""}" placeholder="Enlace del archivo..." class="modal-input">
    
    <div class="modal-btns">
      <button class="modal-btn" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn primary" onclick="saveAttachments('${id}')">Guardar</button>
    </div>
  `);
};
window.saveAttachments = async (id) => {
  await updateDoc(doc(db,"voztasks",id),{
    link: document.getElementById("modal-link").value.trim()||null,
    document: document.getElementById("modal-doc").value.trim()||null
  });
  closeModal();
}

window.openContextModal = (id)=>{
  const t = tasks.find(x=>x.id===id);
  const bullets = (t?.context || "").split("\n").filter(c=>c.trim()!=='');
  const listHtml = bullets.length ? `<ul class="modal-bullets">${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>` : `<p style="font-size:12px; color:var(--ink3); margin-bottom:10px;">Sin comentarios aún.</p>`;
  
  openModal(`
    <h3 class="modal-title">Comentarios / Notas</h3>
    ${listHtml}
    <textarea id="modal-ctx-new" rows="3" placeholder="Añade un nuevo comentario..." class="modal-input" style="height:60px; resize:vertical; margin-top:10px;"></textarea>
    
    <div class="modal-btns">
      <button class="modal-btn" onclick="closeModal()">Cerrar</button>
      <button class="modal-btn primary" onclick="saveContext('${id}', \`${(t?.context||"").replace(/`/g, '\\`')}\`)">Añadir</button>
    </div>
  `);
};
window.saveContext = async (id, oldContext) => {
  const newText = document.getElementById("modal-ctx-new").value.trim();
  if(!newText) { closeModal(); return; }
  const finalContext = oldContext ? oldContext + "\n" + newText : newText;
  await updateDoc(doc(db,"voztasks",id),{context: finalContext});
  closeModal();
}

/* ---- Filters ---- */
window.setCategory = id=>{ 
  if(isArchiveView) toggleArchiveView();
  activeCategory=activeCategory===id?null:id; 
  renderAll(); 
};
window.setPriority = id=>{ 
  if(isArchiveView) toggleArchiveView();
  activePriority=activePriority===id?null:id; 
  renderAll(); 
};
window.setSearch = ()=>{ searchQuery=document.getElementById("search-input").value; renderKanban(); };

/* ---- Calendar ---- */
function renderCalendar(){
  const year=currentMonth.getFullYear(), month=currentMonth.getMonth();
  const label = currentMonth.toLocaleDateString("es-MX",{month:"long",year:"numeric"});
  document.getElementById("cal-month-label").textContent = label.charAt(0).toUpperCase()+label.slice(1);
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();

  const tasksByDay={};
  tasks.forEach(t=>{
    if(!t.deadline || t.status==="archived") return;
    const d=new Date(t.deadline+"T12:00:00");
    if(d.getFullYear()===year && d.getMonth()===month){
      const day=d.getDate();
      if(!tasksByDay[day]) tasksByDay[day]=[];
      tasksByDay[day].push(t);
    }
  });

  let html=`<div class="cal-grid">
    <div class="cal-hdr">D</div><div class="cal-hdr">L</div><div class="cal-hdr">M</div>
    <div class="cal-hdr">M</div><div class="cal-hdr">J</div><div class="cal-hdr">V</div><div class="cal-hdr">S</div>`;
  for(let i=0;i<firstDay;i++) html+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const isToday=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
    const dayTasks=tasksByDay[d]||[];
    const stickers = dayTasks.slice(0,3).map(t=> `<span class="cal-sticker" style="background:${catColor(t.category)}" title="${t.title}" onclick="highlightTask('${t.id}'); event.stopPropagation();"></span>`).join("");
    
    html+=`<div class="cal-cell${isToday?" today":""}${dayTasks.length?" has-t":""}" ${dayTasks.length?`onclick="showDayTasks(${d}, ${month}, ${year})"`:""}>
      <span class="cal-num">${d}</span>
      <div class="cal-stickers">${stickers}</div>
    </div>`;
  }
  html+="</div>";
  document.getElementById("cal-body").innerHTML=html;

  const upcoming=tasks.filter(t=>t.deadline && t.status!=="archived").sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).slice(0,10);
  document.getElementById("cal-upcoming").innerHTML=upcoming.length
    ? upcoming.map(t=>{
        const d=new Date(t.deadline+"T12:00:00");
        const ds=d.toLocaleDateString("es-MX",{day:"numeric",month:"short"});
        const dot=`<span style="width:6px;height:6px;border-radius:50%;background:${catColor(t.category)};display:inline-block;flex-shrink:0"></span>`;
        return `<div class="upcoming-item" onclick="highlightTask('${t.id}')" style="cursor:pointer">${dot}<span class="upcoming-date">${ds}</span><span class="upcoming-title">${t.title}</span></div>`;
      }).join("")
    : `<p class="no-upcoming">Sin deadlines próximos</p>`;
}

window.showDayTasks = (d, m, y) => {
  const dayStr = `${y}-${(m+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
  const dayTasks = tasks.filter(t => t.deadline === dayStr && t.status !== "archived");
  
  let html = `<p class="cal-upcoming-title" style="margin-top:10px; color:var(--accent)">Tareas del ${d}</p>`;
  html += dayTasks.map(t => `<div class="upcoming-item" onclick="highlightTask('${t.id}')" style="cursor:pointer"><span style="width:6px;height:6px;border-radius:50%;background:${catColor(t.category)};display:inline-block;flex-shrink:0"></span><span class="upcoming-title">${t.title}</span></div>`).join("");
  document.getElementById("cal-upcoming").innerHTML = html;
};

window.calPrev=()=>{ currentMonth.setMonth(currentMonth.getMonth()-1); renderCalendar(); };
window.calNext=()=>{ currentMonth.setMonth(currentMonth.getMonth()+1); renderCalendar(); };

/* ---- Notes Expandibles ---- */
function renderNotes(){
  const grid=document.getElementById("notes-grid");
  grid.innerHTML=notes.map(n=>`
    <div class="note-card" id="note-${n.id}" style="--nc:${n.color||"#D5E1FF"}">
      ${n.title?`<p class="note-title">${n.title}</p>`:""}
      <div class="note-body-wrap">
        <p class="note-body" id="nb-${n.id}">${n.body}</p>
      </div>
      <button class="note-expand-btn" onclick="document.getElementById('nb-${n.id}').classList.toggle('expanded')">Leer más / menos</button>
      <div class="note-actions">
        <button class="note-del" onclick="deleteNote('${n.id}')"><i class="fi fi-rr-trash"></i></button>
        <span class="note-date">${new Date(n.createdAt).toLocaleDateString("es-MX",{day:"numeric",month:"short"})}</span>
      </div>
    </div>
  `).join("")||`<p class="no-upcoming">Sin notas aún</p>`;
}

window.addNote=async()=>{
  const title=document.getElementById("note-title").value.trim();
  const body=document.getElementById("note-body").value.trim();
  if(!body) return;
  const colors=["#D5E1FF","#E8D5FF","#D5FFED","#FFE8D5","#FFF3D5"];
  const color=colors[Math.floor(Math.random()*colors.length)];
  await addDoc(notesCol,{title:title||null,body,color,createdAt:new Date().toISOString()});
  document.getElementById("note-title").value="";
  document.getElementById("note-body").value="";
};
window.deleteNote=async id=>{ if(confirm("¿Eliminar nota?")) await deleteDoc(doc(db,"fastask_notes",id)); };

/* ---- Voice & Input Manual ---- */
async function parseTask(transcript){
  const today=new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const res=await fetch("https://gemini-proxy.osvaldo-ronquillo.workers.dev/",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({transcript,today})
  });
  return await res.json();
}

async function saveTask(parsed){
  const catGuess = parsed.category || guessCategory(parsed.context||parsed.title||"");
  await addDoc(tasksCol,{
    title:parsed.title,
    time:parsed.time||null,
    priority:parsed.priority==="normal" ? "baja" : (parsed.priority||"baja"),
    category:catGuess,
    context:parsed.context||null, link:null, document:null,
    deadline: parsed.deadline || null,
    status:"todo", done:false,
    createdAt:new Date().toISOString()
  });
}

function guessCategory(ctx){
  const c=(ctx||"").toLowerCase();
  if(c.includes("freelance")||c.includes("cliente")) return "freelance";
  if(c.includes("trabajo")||c.includes("oficina")||c.includes("interia")) return "trabajo";
  if(c.includes("unir")||c.includes("universidad")||c.includes("escuela")||c.includes("estudio")) return "estudio";
  return "personal";
}

function initRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ showFeedback("Usa Chrome para voz","error"); return null; }
  const r=new SR(); r.lang="es-MX"; r.continuous=false; r.interimResults=true;
  r.onstart=()=>{ isListening=true; updateMicUI(true); showFeedback("Escuchando…","listening"); };
  r.onresult=e=>{ document.getElementById("transcript-preview").textContent=Array.from(e.results).map(r=>r[0].transcript).join(""); };
  r.onerror=e=>{ isListening=false; updateMicUI(false); showFeedback("Error: "+e.error,"error"); };
  r.onend=async()=>{
    isListening=false; updateMicUI(false);
    const text=document.getElementById("transcript-preview").textContent.trim();
    if(!text){ showFeedback("No escuché nada","error"); return; }
    showFeedback("Procesando…","processing");
    try{
      const parsed=await parseTask(text);
      const tasksArray = Array.isArray(parsed) ? parsed : [parsed];
      let guardadas = 0;
      for (const p of tasksArray) {
        if (p.action === "agregar" || p.title) {
          await saveTask(p);
          guardadas++;
        }
      }
      if (guardadas > 0) { showFeedback(`✓ ${guardadas} tarea(s)`,"success"); }
      else showFeedback("No detecté tarea","info");
    }catch(e){ showFeedback("Error al procesar","error"); console.error(e); }
    setTimeout(()=>{ document.getElementById("transcript-preview").textContent=""; },3000);
  };
  return r;
}

window.toggleMic=()=>{
  if(isListening){ recognition?.stop(); return; }
  if(!recognition) recognition=initRecognition();
  recognition?.start();
};

function updateMicUI(on){
  document.getElementById("mic-btn").classList.toggle("listening",on);
  document.getElementById("mic-ring").classList.toggle("active",on);
}

function showFeedback(msg,type){
  const fb=document.getElementById("feedback");
  fb.textContent=msg; fb.className="feedback "+type;
  fb.style.display="inline-block";
  setTimeout(()=>{ fb.style.opacity="1"; },20);
  if(["success","info"].includes(type)) {
    setTimeout(()=>{
      fb.style.opacity="0";
      setTimeout(()=>{ fb.style.display="none"; },400);
    },4000);
  }
}

window.addManual=async()=>{
  const input=document.getElementById("manual-input");
  const val=input.value.trim(); if(!val) return;
  showFeedback("Procesando…","processing");
  try{
    const parsed=await parseTask(val);
    const tasksArray = Array.isArray(parsed) ? parsed : [parsed];
    let guardadas = 0;
    for (const p of tasksArray) {
      if (p.action === "agregar" || p.title) {
        await saveTask(p);
        guardadas++;
      }
    }
    if (guardadas > 0) { showFeedback(`✓ ${guardadas} tarea(s)`,"success"); input.value=""; }
    else { showFeedback("No detecté tarea","info"); }
  }catch(e){ showFeedback("Error al procesar","error"); console.error(e); }
};

window.onManualKey=e=>{ if(e.key==="Enter") window.addManual(); };

window.onInputChange=()=>{
  const hasText = document.getElementById("manual-input").value.trim().length > 0;
  document.getElementById("icon-mic").style.display = hasText ? "none" : "block";
  document.getElementById("icon-check").style.display = hasText ? "block" : "none";
  const btn = document.getElementById("mic-btn");
  if(hasText){
    btn.style.background = "var(--accent)";
    btn.style.borderColor = "var(--accent)";
  } else {
    btn.style.background = "";
    btn.style.borderColor = "";
  }
};

window.handleMicOrSave=()=>{
  const hasText = document.getElementById("manual-input").value.trim().length > 0;
  if(hasText){
    window.addManual();
    setTimeout(()=>{
      document.getElementById("icon-mic").style.display = "block";
      document.getElementById("icon-check").style.display = "none";
      document.getElementById("mic-btn").style.background = "";
      document.getElementById("mic-btn").style.borderColor = "";
    }, 100);
  } else {
    window.toggleMic();
  }
};
window.toggleSidebar=()=>document.getElementById("sidebar").classList.toggle("open");

/* ---- Tema y Colores ---- */
window.toggleTheme = () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
  localStorage.setItem('theme', isLight ? 'dark' : 'light');
};

window.changeColor = (type, id, value) => {
  const varName = `--${type}-${id}`;
  document.documentElement.style.setProperty(varName, value);
  localStorage.setItem(varName, value);
  renderAll(); 
};

['cat-freelance', 'cat-trabajo', 'cat-estudio', 'cat-personal', 'prio-baja', 'prio-media', 'prio-alta'].forEach(key => {
  const saved = localStorage.getItem(`--${key}`);
  if (saved) document.documentElement.style.setProperty(`--${key}`, saved);
});
setTimeout(() => {
  ['cat-freelance', 'cat-trabajo', 'cat-estudio', 'cat-personal', 'prio-baja', 'prio-media', 'prio-alta'].forEach(key => {
    const input = document.getElementById(`picker-${key}`);
    const saved = localStorage.getItem(`--${key}`);
    if (input && saved) input.value = saved;
  });
}, 200);
</script>

<style>

/* Notes Section Expandibles */
.note-new{display:flex;flex-direction:column;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:4px}
.note-new input,.note-new textarea{background:transparent;border:none;outline:none;font-family:var(--font);color:var(--ink);resize:none;width:100%}

.note-body.expanded { -webkit-line-clamp: unset; display: block; }

/* === MODAL === */

.modal-btn{padding:8px 18px;border-radius:8px;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--surface2);color:var(--ink)}
.modal-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

.modal-bullets { padding-left: 20px; font-size: 13px; color: var(--ink); line-height: 1.6; margin-bottom: 16px; }
.modal-bullets li { margin-bottom: 4px; }
</style>
</head>
<body>

<div id="sidebar-backdrop" class="sidebar-backdrop" onclick="toggleSidebar()"></div>

<div id="auth-screen" style="display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)">
  <div style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px;background:var(--surface);border:1px solid var(--border);border-radius:20px">
    <img src="https://raw.githubusercontent.com/osvaldo-ronquillo/Fastask/main/img/fastask.png?v=202606020748" style="height:36px">
    <button id="google-signin-btn" style="padding:12px 24px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--ink);font-weight:600" onclick="signInGoogle()">Entrar con Google</button>
  </div>
</div>

<div class="app" id="app-main" style="display:none">
  
  <header class="topbar">
    <img src="https://raw.githubusercontent.com/osvaldo-ronquillo/Fastask/main/img/fastask.png?v=202606020748" class="logo" alt="Fastask">
    <span class="badge" id="pending-count">0</span>
    
    <div class="search-wrap">
      <i class="fi fi-rr-search"></i>
      <input type="text" id="search-input" placeholder="Buscar tareas…" oninput="setSearch()">
    </div>

    <button class="theme-btn" onclick="toggleTheme()" title="Cambiar Tema"><i class="fi fi-rr-moon-stars"></i></button>
  </header>

  <aside id="sidebar">
    <div class="sidebar-section">
      <p class="sidebar-label">Categorías</p>
      <div class="sidebar-row"><button class="cat-item" data-id="freelance" onclick="setCategory('freelance')"><img src="https://img.icons8.com/forma-light/24/FFFFFF/ninja-head.png" width="16" height="16"> Freelance</button><input type="color" id="picker-cat-freelance" class="sidebar-color-picker" value="#34d399" onchange="changeColor('cat', 'freelance', this.value)"></div>
      <div class="sidebar-row"><button class="cat-item" data-id="trabajo" onclick="setCategory('trabajo')"><img src="https://img.icons8.com/forma-light/24/FFFFFF/briefcase.png" width="16" height="16"> Trabajo</button><input type="color" id="picker-cat-trabajo" class="sidebar-color-picker" value="#FF762C" onchange="changeColor('cat', 'trabajo', this.value)"></div>
      <div class="sidebar-row"><button class="cat-item" data-id="estudio" onclick="setCategory('estudio')"><img src="https://img.icons8.com/forma-light/24/FFFFFF/student-male.png" width="16" height="16"> Estudio</button><input type="color" id="picker-cat-estudio" class="sidebar-color-picker" value="#a78bfa" onchange="changeColor('cat', 'estudio', this.value)"></div>
      <div class="sidebar-row"><button class="cat-item" data-id="personal" onclick="setCategory('personal')"><img src="https://img.icons8.com/forma-light/24/FFFFFF/launched-rocket.png" width="16" height="16"> Personal</button><input type="color" id="picker-cat-personal" class="sidebar-color-picker" value="#f43f5e" onchange="changeColor('cat', 'personal', this.value)"></div>
    </div>
    
    <div class="sidebar-section">
      <p class="sidebar-label">Prioridad</p>
      <div class="sidebar-row"><button class="prio-item" data-id="baja" onclick="setPriority('baja')"><span class="prio-dot" style="--pc:var(--prio-baja)"></span> Baja</button><input type="color" id="picker-prio-baja" class="sidebar-color-picker" value="#7B8EE8" onchange="changeColor('prio', 'baja', this.value)"></div>
      <div class="sidebar-row"><button class="prio-item" data-id="media" onclick="setPriority('media')"><span class="prio-dot" style="--pc:var(--prio-media)"></span> Media</button><input type="color" id="picker-prio-media" class="sidebar-color-picker" value="#F24061" onchange="changeColor('prio', 'media', this.value)"></div>
      <div class="sidebar-row"><button class="prio-item" data-id="alta" onclick="setPriority('alta')"><span class="prio-dot" style="--pc:var(--prio-alta)"></span> Alta</button><input type="color" id="picker-prio-alta" class="sidebar-color-picker" value="#471EC5" onchange="changeColor('prio', 'alta', this.value)"></div>
    </div>

    <div class="sidebar-section" style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border);">
      <div class="sidebar-row">
        <button class="cat-item" id="btn-archive" onclick="toggleArchiveView()" style="justify-content: center; background: var(--surface2);"><i class="fi fi-rr-folder-download"></i> Ver Archivo</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="kanban-wrap" id="kanban-columns">
      <div class="col-wrap">
        <div class="col-title">Sin empezar <span class="col-badge" id="cnt-todo">0</span></div>
        <div class="kanban-col" id="col-todo" data-status="todo"></div>
      </div>
      <div class="col-wrap">
        <div class="col-title">En progreso <span class="col-badge" id="cnt-inprog">0</span></div>
        <div class="kanban-col" id="col-inprogress" data-status="inprogress"></div>
      </div>
      <div class="col-wrap">
        <div class="col-title">Finalizado <span class="col-badge" id="cnt-done">0</span></div>
        <div class="kanban-col" id="col-done" data-status="done"></div>
      </div>
    </div>
    
    <div id="archive-container" style="display: none; height: 100%; overflow-y: auto;">
      <div class="col-title" style="margin-bottom: 20px;">Tareas Archivadas</div>
      <div class="masonry-wrap" id="archive-masonry"></div>
    </div>
  </main>

  <div class="float-bar">
    <div class="float-input-wrap">
      <input type="text" id="manual-input" placeholder="Escribe o dicta una tarea…" onkeydown="onManualKey(event)" oninput="onInputChange()">
      <span id="transcript-preview"></span>
      <div class="mic-wrapper">
        <div class="mic-ring" id="mic-ring"></div>
        <button id="mic-btn" onclick="handleMicOrSave()" aria-label="Micrófono o Guardar">
          <svg id="icon-mic" width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z" stroke="#a09cc0" stroke-width="1.8"/>
            <path d="M6 12a6 6 0 0 0 12 0" stroke="#a09cc0" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="12" y1="18" x2="12" y2="22" stroke="#a09cc0" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <svg id="icon-check" width="17" height="17" viewBox="0 0 24 24" fill="none" style="display:none">
            <path d="M4 12l6 6L20 6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="feedback" class="feedback">—</div>
  </div>

  <aside class="right-panel">
    <div class="right-tabs">
      <button class="rtab active" onclick="switchTab('cal')">Planeador</button>
      <button class="rtab" onclick="switchTab('notes')">Notas</button>
    </div>
    <div class="right-tab-content visible" id="tab-cal">
      <div class="cal-nav-row">
        <button class="cal-nav-btn" onclick="calPrev()">‹</button>
        <span class="cal-month-label" id="cal-month-label"></span>
        <button class="cal-nav-btn" onclick="calNext()">›</button>
      </div>
      <div id="cal-body"></div>
      <div class="cal-upcoming-section">
        <p class="cal-upcoming-title">Próximos deadlines</p>
        <div id="cal-upcoming"></div>
      </div>
    </div>
    
    <div class="right-tab-content" id="tab-notes">
      <div class="note-new">
        <input type="text" id="note-title" placeholder="Título (opcional)">
        <textarea id="note-body" rows="3" placeholder="Escribe una nota…"></textarea>
        <button class="note-add-btn" onclick="addNote()">+ Agregar</button>
      </div>
      <div class="notes-grid" id="notes-grid"></div>
    </div>
  </aside>
</div>

<div id="modal-overlay">
  <div class="modal">
    <div id="modal-content"></div>
  </div>
</div>

</body>
</html>
