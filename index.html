<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fastask</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2WT0lxJ_qrkwF5V04PyFkuYFMEagENuU",
  authDomain: "fastcheck-38bf7.firebaseapp.com",
  projectId: "fastcheck-38bf7",
  storageBucket: "fastcheck-38bf7.firebasestorage.app",
  messagingSenderId: "568423642636",
  appId: "1:568423642636:web:401de51518b864dc11a029"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const tasksCol = collection(db, "voztasks");
const notesCol = collection(db, "fastask_notes");

/* ---- Auth ---- */
setPersistence(auth, browserLocalPersistence);

// Handle redirect result first (for mobile/blocked popup fallback)
getRedirectResult(auth).then(result => {
  if(result?.user) showApp();
}).catch(e => console.error("Redirect result error:", e));

onAuthStateChanged(auth, user => {
  if(user) {
    showApp();
  } else {
    showAuthScreen();
  }
});

function showApp(){
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app-main").style.display = "grid";
}

function showAuthScreen(){
  document.getElementById("auth-screen").style.display = "flex";
  document.getElementById("app-main").style.display = "none";
}

window.signInGoogle = async () => {
  const btn = document.getElementById("google-signin-btn");
  btn.textContent = "Conectando...";
  btn.disabled = true;
  try {
    await signInWithPopup(auth, provider);
  } catch(e) {
    if(e.code === "auth/popup-blocked" || e.code === "auth/cancelled-popup-request") {
      // Fallback to redirect
      await signInWithRedirect(auth, provider);
    } else {
      console.error(e);
      btn.textContent = "Entrar con Google";
      btn.disabled = false;
    }
  }
};

/* ---- State ---- */
let tasks = [], notes = [];
let isListening = false, recognition = null;
let activeCategory = null, activePriority = null;
let currentMonth = new Date();
let dragSrcId = null;
let searchQuery = "";

const CATEGORIES = [
  { id:"freelance",    label:"Freelance",    icon:"https://img.icons8.com/forma-light/24/FFFFFF/ninja-head.png" },
  { id:"trabajo",      label:"Trabajo",      icon:"https://img.icons8.com/forma-light/24/FFFFFF/briefcase.png" },
  { id:"universidad",  label:"Universidad",  icon:"https://img.icons8.com/forma-light/24/FFFFFF/student-male.png" },
  { id:"personal",     label:"Personal",     icon:"https://img.icons8.com/forma-light/24/FFFFFF/launched-rocket.png" },
];
const PRIORITIES = [
  { id:"normal",  label:"Normal",  color:"#7B8EE8" },
  { id:"alta",    label:"Alta",    color:"#C686D1" },
  { id:"urgente", label:"Urgente", color:"#471EC5" },
];

function prioColor(p){ return PRIORITIES.find(x=>x.id===p)?.color||"#7B8EE8"; }
function catObj(id){ return CATEGORIES.find(c=>c.id===id); }

/* ---- Render ---- */
function renderAll(){ renderKanban(); renderCalendar(); renderNotes(); renderBadge(); updateSidebarActive(); }

function renderBadge(){
  const p = tasks.filter(t=>t.status!=="done").length;
  document.getElementById("pending-count").textContent = p;
}

function updateSidebarActive(){
  document.querySelectorAll(".cat-item").forEach(el=>el.classList.toggle("active", el.dataset.id===activeCategory));
  document.querySelectorAll(".prio-item").forEach(el=>el.classList.toggle("active", el.dataset.id===activePriority));
}

function filteredTasks(){
  return tasks.filter(t=>{
    if(activeCategory && t.category!==activeCategory) return false;
    if(activePriority && t.priority!==activePriority) return false;
    if(searchQuery && !t.title?.toLowerCase().includes(searchQuery.toLowerCase())) return false;
    return true;
  });
}

function taskCard(t){
  const prio = PRIORITIES.find(p=>p.id===t.priority)||PRIORITIES[0];
  const cat = catObj(t.category);
  const dl = t.deadline ? new Date(t.deadline+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"short"}) : "";
  return `
  <div class="task-card" data-id="${t.id}" draggable="true">
    <div class="card-header">
      <span class="card-title" onclick="startEditTitle('${t.id}')" title="Click para editar">${t.title}</span>
      <button class="card-delete" onclick="deleteTask('${t.id}')">×</button>
    </div>
    <div class="card-chips">
      ${cat?`<span class="chip cat-chip"><img src="${cat.icon.replace('/forma-light/24/', '/forma-light/24/FFFFFF/')}" width="11" height="11"> ${cat.label}</span>`:""}
      <span class="chip prio-chip" style="--pc:${prio.color}">${prio.label}</span>
      ${t.time?`<span class="chip time-chip">⏰ ${t.time}</span>`:""}
      ${dl?`<span class="chip dl-chip">📅 ${dl}</span>`:""}
    </div>
    ${t.context?`<p class="card-context">${t.context}</p>`:""}
    ${t.link?`<a class="card-link" href="${t.link}" target="_blank" rel="noopener">🔗 ${t.link.replace(/^https?:\/\//,"").slice(0,42)}${t.link.length>50?"…":""}</a>`:""}
    <div class="card-actions">
      <button class="ca-btn" onclick="openDeadlineModal('${t.id}')" title="Deadline"><i class="fi fi-rr-calendar-check"></i></button>
      <button class="ca-btn" onclick="openLinkModal('${t.id}')" title="Enlace"><i class="fi fi-rr-link-alt"></i></button>
      <button class="ca-btn" onclick="openContextModal('${t.id}')" title="Contexto"><i class="fi fi-rr-message-text"></i></button>
      <button class="ca-btn move-btn" onclick="toggleStatus('${t.id}','${t.status||"todo"}')">${t.status==="inprogress"?"↩ Todo":"→ En progreso"}</button>
    </div>
  </div>`;
}

function renderKanban(){
  const ft = filteredTasks();
  const todo = ft.filter(t=>!t.status||t.status==="todo");
  const inprog = ft.filter(t=>t.status==="inprogress");
  document.getElementById("col-todo").innerHTML = todo.map(taskCard).join("")||`<div class="empty-col">Sin tareas</div>`;
  document.getElementById("col-inprogress").innerHTML = inprog.map(taskCard).join("")||`<div class="empty-col">Sin tareas</div>`;
  document.getElementById("cnt-todo").textContent = todo.length;
  document.getElementById("cnt-inprog").textContent = inprog.length;
  document.querySelectorAll(".task-card").forEach(attachDrag);
}

/* ---- Edit title inline ---- */
window.startEditTitle = (id) => {
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const cardEl = document.querySelector(`.task-card[data-id="${id}"] .card-title`);
  const old = t.title;
  cardEl.contentEditable = "true";
  cardEl.focus();
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(cardEl);
  sel.removeAllRanges(); sel.addRange(range);
  cardEl.onblur = async () => {
    cardEl.contentEditable = "false";
    const newTitle = cardEl.textContent.trim();
    if(newTitle && newTitle !== old) await updateDoc(doc(db,"voztasks",id),{title:newTitle});
  };
  cardEl.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); cardEl.blur(); } };
};

/* ---- Drag & Drop ---- */
function attachDrag(el){
  el.addEventListener("dragstart", e=>{ dragSrcId=el.dataset.id; setTimeout(()=>el.classList.add("dragging"),0); });
  el.addEventListener("dragend", ()=>{ el.classList.remove("dragging"); dragSrcId=null; });
}
document.querySelectorAll(".kanban-col").forEach(col=>{
  col.addEventListener("dragover", e=>{ e.preventDefault(); col.classList.add("drag-over"); });
  col.addEventListener("dragleave", ()=>col.classList.remove("drag-over"));
  col.addEventListener("drop", async e=>{
    e.preventDefault(); col.classList.remove("drag-over");
    if(!dragSrcId) return;
    await updateDoc(doc(db,"voztasks",dragSrcId),{status:col.dataset.status});
  });
});

/* ---- Firebase listeners ---- */
const q = query(tasksCol, orderBy("createdAt","asc"));
onSnapshot(q, snap=>{ tasks=snap.docs.map(d=>({id:d.id,...d.data()})); renderAll(); });

const qn = query(notesCol, orderBy("createdAt","desc"));
onSnapshot(qn, snap=>{ notes=snap.docs.map(d=>({id:d.id,...d.data()})); renderNotes(); });

window.deleteTask = async id=>{ if(confirm("¿Eliminar?")) await deleteDoc(doc(db,"voztasks",id)); };
window.toggleStatus = async (id,cur)=>{ await updateDoc(doc(db,"voztasks",id),{status:cur==="inprogress"?"todo":"inprogress"}); };

/* ---- Modal system ---- */
function openModal(html, onSave){
  document.getElementById("modal-content").innerHTML = html;
  document.getElementById("modal-overlay").classList.add("open");
  document.getElementById("modal-save").onclick = onSave;
  document.getElementById("modal-cancel").onclick = closeModal;
}
function closeModal(){ document.getElementById("modal-overlay").classList.remove("open"); }
window.closeModal = closeModal;

window.openDeadlineModal = (id)=>{
  const t = tasks.find(x=>x.id===id);
  const val = t?.deadline||"";
  openModal(`
    <h3 class="modal-title">Establecer deadline</h3>
    <input type="date" id="modal-date" value="${val}" class="modal-input" style="font-size:16px;padding:10px;">
    <div class="deadline-shortcuts">
      <button class="shortcut-btn" onclick="setDateShortcut(0)">Hoy</button>
      <button class="shortcut-btn" onclick="setDateShortcut(1)">Mañana</button>
      <button class="shortcut-btn" onclick="setDateShortcut(7)">En 1 semana</button>
    </div>
  `, async ()=>{
    const date = document.getElementById("modal-date").value;
    await updateDoc(doc(db,"voztasks",id),{deadline:date||null});
    closeModal();
  });
};

window.setDateShortcut = (days)=>{
  const d = new Date(); d.setDate(d.getDate()+days);
  document.getElementById("modal-date").value = d.toISOString().split("T")[0];
};

window.openLinkModal = (id)=>{
  const t = tasks.find(x=>x.id===id);
  openModal(`
    <h3 class="modal-title">Agregar enlace</h3>
    <input type="url" id="modal-link" value="${t?.link||""}" placeholder="https://drive.google.com/..." class="modal-input">
  `, async ()=>{
    await updateDoc(doc(db,"voztasks",id),{link:document.getElementById("modal-link").value.trim()||null});
    closeModal();
  });
};

window.openContextModal = (id)=>{
  const t = tasks.find(x=>x.id===id);
  openModal(`
    <h3 class="modal-title">Agregar contexto</h3>
    <textarea id="modal-ctx" rows="4" placeholder="Notas adicionales sobre esta tarea…" class="modal-input modal-textarea">${t?.context||""}</textarea>
  `, async ()=>{
    const raw = document.getElementById("modal-ctx").value.trim();
    // Strip any HTML/code to plain text only
    const div = document.createElement("div"); div.textContent = raw;
    await updateDoc(doc(db,"voztasks",id),{context:div.textContent||null});
    closeModal();
  });
};

/* ---- Filters ---- */
window.setCategory = id=>{ activeCategory=activeCategory===id?null:id; renderAll(); };
window.setPriority = id=>{ activePriority=activePriority===id?null:id; renderAll(); };
window.setSearch = ()=>{ searchQuery=document.getElementById("search-input").value; renderKanban(); };

/* ---- Calendar ---- */
function renderCalendar(){
  const year=currentMonth.getFullYear(), month=currentMonth.getMonth();
  const label = currentMonth.toLocaleDateString("es-MX",{month:"long",year:"numeric"});
  document.getElementById("cal-month-label").textContent = label.charAt(0).toUpperCase()+label.slice(1);
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();

  const tasksByDay={};
  tasks.forEach(t=>{
    if(!t.deadline) return;
    const d=new Date(t.deadline+"T12:00:00");
    if(d.getFullYear()===year && d.getMonth()===month){
      const day=d.getDate();
      if(!tasksByDay[day]) tasksByDay[day]=[];
      tasksByDay[day].push(t);
    }
  });

  let html=`<div class="cal-grid">
    <div class="cal-hdr">D</div><div class="cal-hdr">L</div><div class="cal-hdr">M</div>
    <div class="cal-hdr">M</div><div class="cal-hdr">J</div><div class="cal-hdr">V</div><div class="cal-hdr">S</div>`;
  for(let i=0;i<firstDay;i++) html+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const isToday=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
    const dayTasks=tasksByDay[d]||[];
    const stickers=dayTasks.slice(0,3).map(t=>`<span class="cal-sticker" style="background:${prioColor(t.priority)}" title="${t.title}"></span>`).join("");
    html+=`<div class="cal-cell${isToday?" today":""}${dayTasks.length?" has-t":""}">
      <span class="cal-num">${d}</span>
      <div class="cal-stickers">${stickers}</div>
    </div>`;
  }
  html+="</div>";
  document.getElementById("cal-body").innerHTML=html;

  // Upcoming deadlines list
  const upcoming=tasks.filter(t=>t.deadline).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).slice(0,6);
  document.getElementById("cal-upcoming").innerHTML=upcoming.length
    ? upcoming.map(t=>{
        const d=new Date(t.deadline+"T12:00:00");
        const ds=d.toLocaleDateString("es-MX",{day:"numeric",month:"short"});
        const dot=`<span style="width:6px;height:6px;border-radius:50%;background:${prioColor(t.priority)};display:inline-block;flex-shrink:0"></span>`;
        return `<div class="upcoming-item">${dot}<span class="upcoming-date">${ds}</span><span class="upcoming-title">${t.title}</span></div>`;
      }).join("")
    : `<p class="no-upcoming">Sin deadlines próximos</p>`;
}

window.calPrev=()=>{ currentMonth.setMonth(currentMonth.getMonth()-1); renderCalendar(); };
window.calNext=()=>{ currentMonth.setMonth(currentMonth.getMonth()+1); renderCalendar(); };

/* ---- Notes (Google Keep style) ---- */
function renderNotes(){
  const grid=document.getElementById("notes-grid");
  grid.innerHTML=notes.map(n=>`
    <div class="note-card" style="--nc:${n.color||"#D5E1FF"}">
      ${n.title?`<p class="note-title">${n.title}</p>`:""}
      <p class="note-body">${n.body}</p>
      <div class="note-actions">
        <button class="note-del" onclick="deleteNote('${n.id}')">×</button>
        <span class="note-date">${new Date(n.createdAt).toLocaleDateString("es-MX",{day:"numeric",month:"short"})}</span>
      </div>
    </div>
  `).join("")||`<p class="no-upcoming">Sin notas aún</p>`;
}

window.addNote=async()=>{
  const title=document.getElementById("note-title").value.trim();
  const body=document.getElementById("note-body").value.trim();
  if(!body) return;
  const colors=["#D5E1FF","#E8D5FF","#D5FFED","#FFE8D5","#FFF3D5"];
  const color=colors[Math.floor(Math.random()*colors.length)];
  await addDoc(notesCol,{title:title||null,body,color,createdAt:new Date().toISOString()});
  document.getElementById("note-title").value="";
  document.getElementById("note-body").value="";
};

window.deleteNote=async id=>{ if(confirm("¿Eliminar nota?")) await deleteDoc(doc(db,"fastask_notes",id)); };

/* ---- Voice ---- */
async function parseTask(transcript){
  const today=new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const res=await fetch("https://gemini-proxy.osvaldo-ronquillo.workers.dev/",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({transcript,today})
  });
  const data=await res.json();
  if(typeof data==="object"&&data.action) return data;
  return JSON.parse(data);
}

async function saveTask(parsed){
  const catGuess = guessCategory(parsed.context||"");
  await addDoc(tasksCol,{
    title:parsed.title,
    time:parsed.time||null,
    priority:parsed.priority==="media"?"normal":(parsed.priority||"normal"),
    category:catGuess,
    context:null, link:null, deadline:null,
    status:"todo", done:false,
    createdAt:new Date().toISOString()
  });
}

function guessCategory(ctx){
  const c=(ctx||"").toLowerCase();
  if(c.includes("freelance")||c.includes("cliente")) return "freelance";
  if(c.includes("trabajo")||c.includes("oficina")||c.includes("interia")) return "trabajo";
  if(c.includes("unir")||c.includes("universidad")||c.includes("escuela")) return "universidad";
  return "personal";
}

function initRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ showFeedback("Usa Chrome para voz","error"); return null; }
  const r=new SR(); r.lang="es-MX"; r.continuous=false; r.interimResults=true;
  r.onstart=()=>{ isListening=true; updateMicUI(true); showFeedback("Escuchando…","listening"); };
  r.onresult=e=>{ document.getElementById("transcript-preview").textContent=Array.from(e.results).map(r=>r[0].transcript).join(""); };
  r.onerror=e=>{ isListening=false; updateMicUI(false); showFeedback("Error: "+e.error,"error"); };
  r.onend=async()=>{
    isListening=false; updateMicUI(false);
    const text=document.getElementById("transcript-preview").textContent.trim();
    if(!text){ showFeedback("No escuché nada","error"); return; }
    showFeedback("Procesando…","processing");
    try{
      const parsed=await parseTask(text);
      if(parsed.action==="agregar"){ await saveTask(parsed); showFeedback(`✓ "${parsed.title}"`,"success"); }
      else showFeedback("No detecté tarea","info");
    }catch(e){ showFeedback("Error al procesar","error"); console.error(e); }
    setTimeout(()=>{ document.getElementById("transcript-preview").textContent=""; },3000);
  };
  return r;
}

window.toggleMic=()=>{
  if(isListening){ recognition?.stop(); return; }
  if(!recognition) recognition=initRecognition();
  recognition?.start();
};

function updateMicUI(on){
  document.getElementById("mic-btn").classList.toggle("listening",on);
  document.getElementById("mic-ring").classList.toggle("active",on);
}

function showFeedback(msg,type){
  const fb=document.getElementById("feedback");
  fb.textContent=msg; fb.className="feedback "+type; fb.style.opacity="1";
  if(["success","info"].includes(type)) setTimeout(()=>{ fb.style.opacity="0"; },4000);
}

window.addManual=async()=>{
  const input=document.getElementById("manual-input");
  const val=input.value.trim(); if(!val) return;
  showFeedback("Procesando…","processing");
  try{
    const parsed=await parseTask("Guardar tarea: "+val);
    if(parsed.action==="agregar"){ await saveTask(parsed); showFeedback(`✓ "${parsed.title}"`,"success"); input.value=""; }
  }catch(e){ showFeedback("Error al procesar","error"); }
};

window.onManualKey=e=>{ if(e.key==="Enter") window.addManual(); };
window.toggleSidebar=()=>document.getElementById("sidebar").classList.toggle("open");
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0e1a;
  --surface:#1a1830;
  --surface2:#231f3a;
  --surface3:#2d2850;
  --ink:#f0eeff;
  --ink2:#a09cc0;
  --ink3:#5e5a7a;
  --accent:#324CF3;
  --accent2:#C686D1;
  --accent3:#2E83F2;
  --violet:#471EC5;
  --lavender:#D5E1FF;
  --border:#2a2648;
  --radius:12px;
  --font:'Bricolage Grotesque',sans-serif;
  --mono:'DM Mono',monospace;
  --sidebar-w:210px;
  --right-w:270px;
}

body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;overflow:hidden}

/* === LAYOUT === */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr var(--right-w);grid-template-rows:60px 1fr 80px;height:100vh}

/* === TOPBAR === */
.topbar{
  grid-column:1/-1;display:flex;align-items:center;gap:12px;
  padding:10px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:relative;z-index:20;
}

.logo{height:28px;object-fit:contain}

.badge{background:var(--accent);color:#fff;font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:100px;flex-shrink:0}

.search-wrap{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:8px 14px;max-width:500px;margin:0 auto;
}
.search-wrap i{color:var(--ink3);font-size:14px}
.search-wrap input{flex:1;border:none;background:transparent;font-family:var(--font);font-size:13px;color:var(--ink);outline:none}
.search-wrap input::placeholder{color:var(--ink3)}

.mobile-btn{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink2);font-size:14px}
.mobile-right-btn{display:none}

/* === SIDEBAR === */
#sidebar{
  grid-column:1;grid-row:2/4;
  background:var(--surface);border-right:1px solid var(--border);
  padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:24px;
}

.sidebar-section{}
.sidebar-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;padding-left:8px}

.cat-item,.prio-item{
  display:flex;align-items:center;gap:9px;
  padding:7px 10px;border-radius:8px;
  cursor:pointer;font-size:13px;font-weight:500;
  transition:background .15s,color .15s;
  border:none;background:none;width:100%;text-align:left;color:var(--ink2);
}
.cat-item:hover,.prio-item:hover{background:var(--surface2);color:var(--ink)}
.cat-item.active,.prio-item.active{background:var(--accent);color:#fff}
.cat-item.active img,.prio-item.active img{filter:invert(1) brightness(2)}
.prio-dot{width:7px;height:7px;border-radius:50%;background:var(--pc,#7B8EE8);flex-shrink:0}

/* === MAIN === */
.main{grid-column:2;grid-row:2;overflow:hidden;padding:16px 16px 0;display:flex;flex-direction:column;gap:12px}

.kanban-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;overflow:hidden}

.col-wrap{display:flex;flex-direction:column;overflow:hidden}
.col-title{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:8px;display:flex;align-items:center;gap:8px;
}
.col-badge{background:var(--surface3);border-radius:100px;padding:1px 8px;font-size:10px;color:var(--ink2)}

.kanban-col{
  flex:1;overflow-y:auto;
  background:var(--surface2);border-radius:var(--radius);padding:8px;
  display:flex;flex-direction:column;gap:7px;
  border:1.5px dashed transparent;transition:border-color .15s,background .15s;
}
.kanban-col::-webkit-scrollbar{width:4px}
.kanban-col::-webkit-scrollbar-track{background:transparent}
.kanban-col::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:2px}
.kanban-col.drag-over{border-color:var(--accent);background:rgba(50,76,243,.08)}
.empty-col{font-size:11px;color:var(--ink3);text-align:center;padding:24px;font-family:var(--mono)}

/* === TASK CARD === */
.task-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:11px;cursor:grab;transition:box-shadow .15s,border-color .15s;
  animation:card-in .2s ease;
}
@keyframes card-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.task-card:hover{box-shadow:0 4px 20px rgba(50,76,243,.15);border-color:var(--accent)}
.task-card.dragging{opacity:.4;cursor:grabbing}

.card-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
.card-title{flex:1;font-size:13px;font-weight:500;line-height:1.35;color:var(--ink);cursor:pointer;border-radius:4px;padding:1px 3px;transition:background .15s}
.card-title:hover{background:var(--surface2)}
.card-title[contenteditable="true"]{background:var(--surface3);outline:1px solid var(--accent);border-radius:4px}
.card-delete{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:17px;line-height:1;opacity:0;transition:opacity .15s;flex-shrink:0}
.task-card:hover .card-delete{opacity:1}
.card-delete:hover{color:#ef4444}

.card-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.chip{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:100px;display:flex;align-items:center;gap:3px}
.cat-chip{background:var(--surface3);color:var(--ink2)}
.prio-chip{background:color-mix(in srgb,var(--pc) 18%,transparent);color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 30%,transparent)}
.time-chip{background:rgba(46,131,242,.15);color:var(--accent3)}
.dl-chip{background:rgba(198,134,209,.15);color:var(--accent2)}

.card-context{font-size:11px;color:var(--ink2);line-height:1.5;margin-bottom:6px}
.card-link{font-size:11px;color:var(--accent3);text-decoration:none;display:block;margin-bottom:6px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-link:hover{text-decoration:underline}

.card-actions{display:flex;gap:4px;flex-wrap:wrap;opacity:0;transition:opacity .15s;margin-top:2px}
.task-card:hover .card-actions{opacity:1}
.ca-btn{
  font-family:var(--mono);font-size:10px;padding:3px 8px;
  border:1px solid var(--border);border-radius:6px;
  background:var(--surface2);cursor:pointer;color:var(--ink2);
  transition:all .15s;display:flex;align-items:center;gap:4px;
}
.ca-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.ca-btn i{font-size:12px}
.move-btn{margin-left:auto;color:var(--accent3);border-color:rgba(46,131,242,.3)}
.move-btn:hover{background:var(--accent3)}

/* === FLOATING INPUT === */
.float-bar{
  grid-column:2;grid-row:3;
  display:flex;align-items:center;gap:8px;
  padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);
  position:relative;z-index:10;
}
.float-input-wrap{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:100px;padding:10px 16px;
  transition:border-color .2s,box-shadow .2s;
}
.float-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(50,76,243,.15)}
.float-input-wrap input{flex:1;border:none;background:transparent;font-family:var(--font);font-size:14px;color:var(--ink);outline:none}
.float-input-wrap input::placeholder{color:var(--ink3)}
#transcript-preview{font-size:12px;color:var(--ink2);font-style:italic;white-space:nowrap;overflow:hidden;max-width:160px;text-overflow:ellipsis}

.mic-wrapper{position:relative;display:flex;align-items:center;justify-content:center}
.mic-ring{position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--accent);opacity:0;pointer-events:none;transition:opacity .3s}
.mic-ring.active{opacity:.6;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

#mic-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;position:relative;z-index:1;flex-shrink:0}
#mic-btn:hover{background:var(--accent);border-color:var(--accent)}
#mic-btn:hover path,#mic-btn:hover line{stroke:#fff}
#mic-btn.listening{background:var(--accent);border-color:var(--accent)}
#mic-btn.listening path,#mic-btn.listening line{stroke:#fff}

.save-btn{padding:10px;background:var(--accent);color:#fff;border:none;border-radius:100px;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:500;transition:opacity .15s;flex-shrink:0}
.save-btn:hover{opacity:.85}

.feedback{font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:100px;transition:opacity .4s;white-space:nowrap;flex-shrink:0}
.feedback.listening{background:var(--surface3);color:var(--ink2)}
.feedback.processing{background:rgba(198,134,209,.2);color:var(--accent2)}
.feedback.success{background:rgba(50,243,130,.15);color:#4ade80}
.feedback.error{background:rgba(239,68,68,.15);color:#f87171}
.feedback.info{background:var(--surface3);color:var(--ink2)}

/* === RIGHT PANEL === */
.right-panel{
  grid-column:3;grid-row:2/4;
  background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}

.right-tabs{display:flex;border-bottom:1px solid var(--border)}
.rtab{
  flex:1;padding:10px;text-align:center;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  cursor:pointer;border:none;background:none;transition:all .15s;border-bottom:2px solid transparent;
}
.rtab.active{color:var(--accent3);border-bottom-color:var(--accent3)}
.rtab:hover{color:var(--ink2)}

.right-tab-content{display:none;flex:1;overflow-y:auto;padding:14px}
.right-tab-content.visible{display:flex;flex-direction:column;gap:12px}

/* Calendar tab */
.cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month-label{font-size:13px;font-weight:600;color:var(--ink)}
.cal-nav-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:12px;color:var(--ink2);transition:background .15s}
.cal-nav-btn:hover{background:var(--surface2)}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-hdr{font-family:var(--mono);font-size:9px;text-align:center;color:var(--ink3);padding:4px 0;letter-spacing:.04em}
.cal-cell{min-height:34px;border-radius:6px;padding:3px;display:flex;flex-direction:column;align-items:center}
.cal-cell.empty{background:transparent}
.cal-num{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.cal-cell.today{background:var(--accent);border-radius:6px}
.cal-cell.today .cal-num{color:#fff}
.cal-cell.has-t{background:var(--surface3)}
.cal-stickers{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.cal-sticker{width:5px;height:5px;border-radius:50%}

.cal-upcoming-section{border-top:1px solid var(--border);padding-top:12px}
.cal-upcoming-title{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.upcoming-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.upcoming-item:last-child{border-bottom:none}
.upcoming-date{font-family:var(--mono);font-size:10px;color:var(--ink3);white-space:nowrap;min-width:46px}
.upcoming-title{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.no-upcoming{font-size:11px;color:var(--ink3);font-family:var(--mono);text-align:center;padding:12px 0}

/* Notes tab */
.note-new{display:flex;flex-direction:column;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:4px}
.note-new input,.note-new textarea{background:transparent;border:none;outline:none;font-family:var(--font);color:var(--ink);resize:none;width:100%}
.note-new input{font-size:13px;font-weight:600;border-bottom:1px solid var(--border);padding-bottom:6px}
.note-new input::placeholder{color:var(--ink3)}
.note-new textarea{font-size:12px;line-height:1.5;color:var(--ink2)}
.note-new textarea::placeholder{color:var(--ink3)}
.note-add-btn{align-self:flex-end;padding:5px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:10px;transition:opacity .15s}
.note-add-btn:hover{opacity:.85}

.notes-grid{display:flex;flex-direction:column;gap:8px}
.note-card{background:color-mix(in srgb,var(--nc) 20%,var(--surface));border:1px solid color-mix(in srgb,var(--nc) 40%,var(--border));border-radius:10px;padding:10px;animation:card-in .2s ease}
.note-title{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:4px}
.note-body{font-size:12px;color:var(--ink2);line-height:1.5;white-space:pre-wrap}
.note-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.note-del{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:15px;transition:color .15s}
.note-del:hover{color:#f87171}
.note-date{font-family:var(--mono);font-size:9px;color:var(--ink3)}

/* === MODAL === */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;min-width:320px;max-width:90vw}
.modal-title{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--ink)}
.modal-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:var(--font);font-size:13px;color:var(--ink);outline:none;transition:border-color .2s;margin-bottom:10px;display:block}
.modal-input:focus{border-color:var(--accent)}
.modal-textarea{resize:vertical;min-height:80px;font-size:13px;line-height:1.5}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.modal-btn{padding:8px 18px;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:11px;border:1px solid var(--border);background:var(--surface2);color:var(--ink2);transition:all .15s}
.modal-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-btn:hover{opacity:.85}
.deadline-shortcuts{display:flex;gap:6px;margin-bottom:10px}
.shortcut-btn{flex:1;padding:6px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--ink2);font-family:var(--mono);font-size:10px;cursor:pointer;transition:all .15s}
.shortcut-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* sidebar close btn */
.sidebar-close{display:none;position:absolute;top:12px;right:12px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--ink2);font-size:18px;cursor:pointer;padding:2px 10px;line-height:1}

/* sidebar close btn */
.sidebar-close{display:none;position:absolute;top:12px;right:12px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--ink2);font-size:18px;cursor:pointer;padding:2px 10px;line-height:1}

/* === MOBILE === */
@media(max-width:900px){
  /* Full flex column layout */
  .app{
    display:flex !important;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
  }

  .mobile-btn{display:flex !important}
  .topbar{flex-shrink:0;padding:10px}
  .search-wrap{max-width:none;flex:1}

  /* Sidebar — full height overlay */
  #sidebar{
    position:fixed;
    left:-100%;top:0;bottom:0;
    z-index:300;
    width:260px;
    transition:left .3s ease;
    grid-column:unset;grid-row:unset;
  }
  #sidebar.open{left:0;box-shadow:8px 0 40px rgba(0,0,0,.7)}
  .sidebar-close{display:block}

  /* Backdrop when sidebar open */
  .sidebar-backdrop{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.5);
    z-index:299;
  }
  .sidebar-backdrop.visible{display:block}

  /* Main — flex:1 to fill space between topbar and float-bar */
  .main{
    flex:1;
    min-height:0;
    overflow:hidden;
    padding:10px;
    grid-column:unset;grid-row:unset;
  }

  /* Single column kanban */
  .kanban-wrap{
    grid-template-columns:1fr;
    height:100%;
    overflow-y:auto;
  }

  /* Float bar always at bottom */
  .float-bar{
    flex-shrink:0;
    grid-column:unset;grid-row:unset;
    padding:10px;
  }

  /* Right panel — collapsible above float bar */
  .right-panel{
    flex-shrink:0;
    grid-column:unset;grid-row:unset;
    border-left:none;
    border-top:1px solid var(--border);
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease;
  }
  .right-panel.open{max-height:50vh;overflow-y:auto}
  .mobile-right-btn{display:flex !important}
}
</style>
</head>
<body>

<div id="sidebar-backdrop" class="sidebar-backdrop" onclick="toggleSidebar()"></div>
<!-- AUTH SCREEN -->
<div id="auth-screen" style="display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)">
  <div style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:40px;background:var(--surface);border:1px solid var(--border);border-radius:20px;min-width:300px">
    <img src="https://raw.githubusercontent.com/osvaldo-ronquillo/Fastask/main/img/fastask.png" style="height:36px">
    <p style="font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:center">Tu organizador personal</p>
    <button id="google-signin-btn" onclick="signInGoogle()" style="display:flex;align-items:center;gap:10px;padding:12px 24px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-family:var(--font);font-size:14px;color:var(--ink);transition:all .2s;width:100%;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Entrar con Google
    </button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app-main" style="display:none">

  <!-- TOPBAR -->
  <header class="topbar">
    <button class="mobile-btn" onclick="toggleSidebar()">☰</button>
    <img src="https://raw.githubusercontent.com/osvaldo-ronquillo/Fastask/main/img/fastask.png" class="logo" alt="Fastask">
    <span class="badge" id="pending-count">0</span>
    <div class="search-wrap">
      <i class="fi fi-rr-search"></i>
      <input type="text" id="search-input" placeholder="Buscar tareas…" oninput="setSearch()">
    </div>
    <button class="mobile-btn mobile-right-btn" onclick="toggleRightPanel()" title="Planeador / Notas"><i class="fi fi-rr-calendar-check"></i></button>
  </header>

  <!-- SIDEBAR -->
  <aside id="sidebar"><button class="sidebar-close" onclick="toggleSidebar()">×</button>
    <div class="sidebar-section">
      <p class="sidebar-label">Categorías</p>
      <button class="cat-item" data-id="freelance" onclick="setCategory('freelance')"><img src="https://img.icons8.com/forma-light/24/FFFFFF/ninja-head.png" width="16" height="16"> Freelance</button>
      <button class="cat-item" data-id="trabajo" onclick="setCategory('trabajo')"><img src="https://img.icons8.com/forma-light/24/FFFFFF/briefcase.png" width="16" height="16"> Trabajo</button>
      <button class="cat-item" data-id="universidad" onclick="setCategory('universidad')"><img src="https://img.icons8.com/forma-light/24/FFFFFF/student-male.png" width="16" height="16"> Universidad</button>
      <button class="cat-item" data-id="personal" onclick="setCategory('personal')"><img src="https://img.icons8.com/forma-light/24/FFFFFF/launched-rocket.png" width="16" height="16"> Personal</button>
    </div>
    <div class="sidebar-section">
      <p class="sidebar-label">Prioridad</p>
      <button class="prio-item" data-id="normal" onclick="setPriority('normal')"><span class="prio-dot" style="--pc:#7B8EE8"></span><img src="https://img.icons8.com/forma-light/24/FFFFFF/drawing.png" width="16" height="16"> Normal</button>
      <button class="prio-item" data-id="alta" onclick="setPriority('alta')"><span class="prio-dot" style="--pc:#C686D1"></span><img src="https://img.icons8.com/forma-light/24/FFFFFF/quick-mode-on.png" width="16" height="16"> Alta</button>
      <button class="prio-item" data-id="urgente" onclick="setPriority('urgente')"><span class="prio-dot" style="--pc:#471EC5"></span><img src="https://img.icons8.com/forma-light/24/FFFFFF/fire-element.png" width="16" height="16"> Urgente</button>
    </div>
  </aside>

  <!-- MAIN KANBAN -->
  <main class="main">
    <div class="kanban-wrap">
      <div class="col-wrap">
        <div class="col-title">Sin empezar <span class="col-badge" id="cnt-todo">0</span></div>
        <div class="kanban-col" id="col-todo" data-status="todo"></div>
      </div>
      <div class="col-wrap">
        <div class="col-title">En progreso <span class="col-badge" id="cnt-inprog">0</span></div>
        <div class="kanban-col" id="col-inprogress" data-status="inprogress"></div>
      </div>
    </div>
  </main>

  <!-- FLOATING INPUT BAR -->
  <div class="float-bar">
    <div class="float-input-wrap">
      <input type="text" id="manual-input" placeholder="Escribe o dicta una tarea…" onkeydown="onManualKey(event)">
      <span id="transcript-preview"></span>
      <div class="mic-wrapper">
        <div class="mic-ring" id="mic-ring"></div>
        <button id="mic-btn" onclick="toggleMic()" aria-label="Micrófono">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z" stroke="#a09cc0" stroke-width="1.8"/>
            <path d="M6 12a6 6 0 0 0 12 0" stroke="#a09cc0" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="12" y1="18" x2="12" y2="22" stroke="#a09cc0" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="save-btn" onclick="addManual()">Guardar</button>
    <div id="feedback" class="feedback" style="opacity:0">—</div>
  </div>

  <!-- RIGHT PANEL -->
  <aside class="right-panel" id="right-panel">
    <div class="right-tabs">
      <button class="rtab active" onclick="switchTab('cal')"><i class="fi fi-rr-calendar-check"></i> Planeador</button>
      <button class="rtab" onclick="switchTab('notes')"><i class="fi fi-rr-pen-field"></i> Notas</button>
    </div>

    <!-- Calendar tab -->
    <div class="right-tab-content visible" id="tab-cal">
      <div class="cal-nav-row">
        <button class="cal-nav-btn" onclick="calPrev()">‹</button>
        <span class="cal-month-label" id="cal-month-label"></span>
        <button class="cal-nav-btn" onclick="calNext()">›</button>
      </div>
      <div id="cal-body"></div>
      <div class="cal-upcoming-section">
        <p class="cal-upcoming-title">Próximos deadlines</p>
        <div id="cal-upcoming"></div>
      </div>
    </div>

    <!-- Notes tab -->
    <div class="right-tab-content" id="tab-notes">
      <div class="note-new">
        <input type="text" id="note-title" placeholder="Título (opcional)">
        <textarea id="note-body" rows="3" placeholder="Escribe una nota…"></textarea>
        <button class="note-add-btn" onclick="addNote()">+ Agregar</button>
      </div>
      <div class="notes-grid" id="notes-grid"></div>
    </div>
  </aside>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div class="modal">
    <div id="modal-content"></div>
    <div class="modal-btns">
      <button class="modal-btn" id="modal-cancel">Cancelar</button>
      <button class="modal-btn primary" id="modal-save">Guardar</button>
    </div>
  </div>
</div>

<script>
function switchTab(tab){
  document.querySelectorAll(".right-tab-content").forEach(el=>el.classList.remove("visible"));
  document.querySelectorAll(".rtab").forEach(el=>el.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("visible");
  event.target.classList.add("active");
}

function toggleRightPanel(){
  const panel = document.getElementById("right-panel");
  panel.classList.toggle("open");
  // Show calendar tab by default when opening
  if(panel.classList.contains("open")){
    document.querySelectorAll(".right-tab-content").forEach(el=>el.classList.remove("visible"));
    document.querySelectorAll(".rtab").forEach(el=>el.classList.remove("active"));
    document.getElementById("tab-cal").classList.add("visible");
    document.querySelectorAll(".rtab")[0].classList.add("active");
  }
}

// Re-init drag on kanban cols after script module runs
setTimeout(()=>{
  document.querySelectorAll(".kanban-col").forEach(col=>{
    col.addEventListener("dragover", e=>{ e.preventDefault(); col.classList.add("drag-over"); });
    col.addEventListener("dragleave", ()=>col.classList.remove("drag-over"));
    col.addEventListener("drop", async e=>{
      e.preventDefault(); col.classList.remove("drag-over");
      if(!window.dragSrcId) return;
      const {getFirestore,doc,updateDoc}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    });
  });
},500);
</script>
</div><!-- /app-main -->
</body>
</html>
